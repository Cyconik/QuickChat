name: quickchat
description: A modern decentralized mesh chat and nearby social application with multi-hop BLE forwarding, end-to-end encryption, and offline-first hybrid cloud fallback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & Real-time
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  
  # Bluetooth Low Energy
  flutter_blue_plus: ^1.32.7
  flutter_ble_peripheral: ^1.1.1
  
  # Permissions & Platform
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  flutter_local_notifications: ^17.1.2
  
  # Storage & Caching
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Cryptography & Security
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.7.4
  uuid: ^4.4.0
  
  # UI & Animations
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
